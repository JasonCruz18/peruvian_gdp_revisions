name: peru_gdp_rtd
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.10,<3.13

  # Core data processing
  - pandas>=2.0.0
  - numpy>=1.24.0

  # Configuration
  - pyyaml>=6.0

  # HTTP and web scraping
  - requests>=2.32.5
  - urllib3>=2.6.2
  - selenium>=4.39.0

  # PDF processing
  - pymupdf>=1.26.7
  - pypdf>=6.4.2

  # Utilities
  - tqdm>=4.66.5
  - colorama>=0.4.6

  # Notebook support
  - ipywidgets>=8.1.8
  - jupyter>=1.0.0
  - notebook>=7.5.1

  # Java for tabula-py
  - openjdk>=11

  # Pip packages not provided by conda-forge in the desired form
  - pip
  - pip:
    - webdriver-manager>=4.0.0
    - tabula-py>=2.9.0
    - roman>=4.1
