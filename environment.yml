name: peru_gdp_rtd
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.10,<3.13

  # Core data processing
  - pandas>=2.0.0
  - numpy>=1.24.0

  # Configuration
  - pyyaml>=6.0

  # HTTP and web scraping (Security Update 2025-12-17)
  - requests>=2.32.5
  - urllib3>=2.6.2
  - selenium>=4.39.0

  # PDF processing (Security Update 2025-12-17)
  - pymupdf>=1.26.7
  - pypdf2>=3.0.1

  # Utilities
  - pygame>=2.5.2
  - tqdm>=4.66.5
  - colorama>=0.4.6

  # Jupyter support (Security Update 2025-12-17)
  - ipywidgets>=8.1.8
  - jupyter>=1.0.0
  - notebook>=7.5.1

  # Development tools (optional)
  - black>=23.0.0
  - flake8>=6.0.0
  - isort>=5.12.0
  - pytest>=7.4.0
  - pytest-cov>=4.1.0

  # Java for tabula-py
  - openjdk>=11

  # Pip packages (not available or better via pip)
  - pip
  - pip:
    - webdriver-manager>=4.0.0
    - tabula-py>=2.9.0
    - roman>=4.1
