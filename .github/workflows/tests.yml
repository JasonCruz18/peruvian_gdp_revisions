name: Tests

on:
  push:
    branches: [ main, repo_restructuring ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Java (required for tabula-py)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install package
      run: |
        pip install -e .

    - name: Copy config file
      run: |
        cp config/config.example.yaml config/config.yaml

    - name: Run smoke tests
      run: |
        python tests/test_smoke.py

    - name: Check code formatting (Black)
      run: |
        black --check peru_gdp_rtd/ scripts/ tests/
      continue-on-error: true

    - name: Check import sorting (isort)
      run: |
        isort --check-only peru_gdp_rtd/ scripts/ tests/
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 peru_gdp_rtd/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

  dry-run-pipeline:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install package
      run: |
        pip install -e .

    - name: Copy config file
      run: |
        cp config/config.example.yaml config/config.yaml

    - name: Test pipeline dry-run
      run: |
        python scripts/update_rtd.py --dry-run

    - name: Test pipeline steps 3-6 (skip download)
      run: |
        python scripts/update_rtd.py --steps 3,4,5,6 --dry-run
