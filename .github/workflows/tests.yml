name: Tests

on:
  push:
    branches: [ main, repo_restructuring ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Java (required for tabula-py)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install development dependencies (optional)
      run: |
        pip install black isort flake8 pytest pytest-cov
      continue-on-error: true

    - name: Install package
      run: |
        pip install -e .

    - name: Create config file (cross-platform)
      shell: python
      run: |
        import shutil
        from pathlib import Path
        config_example = Path('config/config.example.yaml')
        config_target = Path('config/config.yaml')
        if config_example.exists() and not config_target.exists():
            shutil.copy(config_example, config_target)
            print(f"Created {config_target}")
        else:
            print(f"Config already exists or example not found")

    - name: Run smoke tests
      run: |
        python tests/test_smoke.py

    - name: Check code formatting with Black (optional)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        black --check peru_gdp_rtd/ scripts/ tests/ || echo "Black check failed (non-blocking)"
      continue-on-error: true

    - name: Check import sorting with isort (optional)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        isort --check-only peru_gdp_rtd/ scripts/ tests/ || echo "isort check failed (non-blocking)"
      continue-on-error: true

    - name: Lint with flake8 (optional)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        flake8 peru_gdp_rtd/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "flake8 check failed (non-blocking)"
      continue-on-error: true

  dry-run-pipeline:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install package
      run: |
        pip install -e .

    - name: Create config file
      run: |
        cp config/config.example.yaml config/config.yaml

    - name: Test pipeline dry-run
      run: |
        python scripts/update_rtd.py --dry-run

    - name: Test pipeline steps 3-6 (skip download)
      run: |
        python scripts/update_rtd.py --steps 3,4,5,6 --dry-run
